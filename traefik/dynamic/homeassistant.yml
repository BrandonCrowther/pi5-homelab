# Home Assistant public route.
#
# Behind secure-public, and the owner account has TOTP enrolled. To take it
# offline, rename this file to homeassistant.yml.disabled -- the file provider
# only parses .yml/.yaml/.toml/.json, and watch=true picks the change up within
# a second. Bans land in homeassistant/config/ip_bans.yaml; delete a line there
# to unban yourself.
http:
  routers:
    homeassistant:
      rule: "Host(`ha.bcrowthe.com`)"
      entryPoints:
        - websecure
      tls:
        certResolver: le
      middlewares:
        - secure-public@file
      service: homeassistant

  services:
    homeassistant:
      loadBalancer:
        servers:
          # Home Assistant runs network_mode: host for mDNS/SSDP discovery, so
          # it has no container IP and the Docker provider cannot see it. This
          # is the Pi's LAN address; verified reachable from inside the traefik
          # container.
          - url: "http://192.168.2.2:8123"
        passHostHeader: true
