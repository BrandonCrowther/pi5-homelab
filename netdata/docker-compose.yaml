services:
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    hostname: pi5-homelab
    restart: unless-stopped

    # Bounded logs: 3 rotated files of 10 MB, so 30 MB per service at worst.
    # json-file has no time-based retention, so size is the only knob there is.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Netdata needs elevated privileges to monitor the host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined

    volumes:
      # Host system monitoring
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Persistent Netdata configuration and data
      - ./config:/etc/netdata
      - ./lib:/var/lib/netdata
      - ./cache:/var/cache/netdata

    environment:
      - DOCKER_HOST=/var/run/docker.sock

    ports:
      - "19999:19999"
