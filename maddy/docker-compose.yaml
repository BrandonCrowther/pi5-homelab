services:
  photofield:
    image: ghcr.io/smilyorg/photofield:latest
    container_name: maddy
    restart: unless-stopped
    # Bounded logs: 3 rotated files of 10 MB, so 30 MB per service at worst.
    # json-file has no time-based retention, so size is the only knob there is.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./photos:/app/photos:ro
      - ./data:/app/data
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.photofield.rule=Host(`maddy.${DOMAIN}`)"
      - "traefik.http.routers.photofield.entrypoints=websecure"
      - "traefik.http.routers.photofield.tls=true"
      - "traefik.http.routers.photofield.tls.certresolver=le"

networks:
  backend:
    name: traefik_backend
    external: true
