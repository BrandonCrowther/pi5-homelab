# Unbound configuration file for Pi-hole
# Basic recursive resolver with privacy and performance optimizations
# Listens on localhost:5335

server:
    # Network configuration
    interface: 127.0.0.1@5335
    port: 5335
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # Performance tuning
    num-threads: 2
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    # Cache sizes (100MB total)
    rrset-cache-size: 50m
    msg-cache-size: 50m

    # Outgoing connections
    # outgoing-range * num-threads must fit under the container's nofile limit,
    # which the compose file raises to 4096 for this reason.
    outgoing-range: 950
    num-queries-per-thread: 512

    # The image compiles in so-sndbuf: 4194304, which the host's
    # net.core.wmem_max (212992) cannot grant - it warned on every start.
    # 0 means "use the system value".
    so-sndbuf: 0

    # Cache optimization
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 3600

    # Privacy settings
    hide-identity: yes
    hide-version: yes
    minimal-responses: yes
    qname-minimisation: yes

    # DNSSEC. Without a trust anchor the validator module loads but validates
    # nothing - the harden-* options below were inert until this was set.
    # Shipped with the image; RFC5011 rollover updates are written back here but
    # reset on container recreate, which is fine as root KSK rollovers are rare.
    auto-trust-anchor-file: "/etc/unbound/root.key"

    # Security hardening
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: no
    harden-algo-downgrade: no
    use-caps-for-id: no
    unwanted-reply-threshold: 10000

    # Logging
    verbosity: 1
    log-queries: no
    log-replies: no
    log-servfail: no
    logfile: ""

    # Local zones
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

    # Access control
    access-control: 127.0.0.0/8 allow
    access-control: ::1 allow
