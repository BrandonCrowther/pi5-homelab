# Bathroom light: re-adapt the moment the bulb comes back on the mesh.
#
# THE HARDWARE CONSTRAINT
#
# The bulb is a ThirdReality 3RCB01057Z ("ZL1") behind a dumb wall switch, so
# the switch cuts mains. The bulb lights from its own firmware before it has
# rejoined the Zigbee mesh -- nothing HA does can be early enough to prevent a
# flash of whatever level the firmware picks. That flash is ACCEPTED by design
# here; this automation corrects it after the fact.
#
# The previous design tried to prevent the flash by writing the bulb's firmware
# power-on brightness (ZCL LevelControl StartUpCurrentLevel, 0x4000, exposed as
# number.*_power_on_level). THAT DOES NOT WORK ON THIS BULB and the automation
# that did it has been deleted. The bulb accepts the write, stores it in NVRAM
# and reads it back correctly -- then ignores it at power-up. Confirmed twice:
#
#   1. Empirically -- 254 was written and verified by a genuine post-restart
#      read-back, and the bulb still came up dim across several wall cycles.
#      (An earlier "VERIFIED WORKING" note wrote 13, saw a dim bulb, and called
#      it a pass. That test cannot distinguish success from failure: a bulb that
#      always comes up dim produces the same result. It was a false positive.)
#   2. By the vendor -- discuss.3reality.com/d/272, "Bulb - Choosing startup
#      brightness after cold power on" (Feb 2026). ThirdReality's reply: the
#      request has been passed to engineering and they hope to "realize this
#      function soon". It is an unimplemented feature, not a misconfiguration.
#
# WHY THIS TRIGGER WORKS
#
# Adaptive Lighting only applies its curve instantly on a literal 'off' -> 'on'
# transition (switch.py: `elif old_off and new_on` requires the *old* state to
# be exactly STATE_OFF). A bulb cut at the wall goes 'unavailable' -> 'on' and
# misses that branch. With `only_once: true` in configuration.yaml, AL's 90s
# tick also returns early without touching the light -- so without this
# automation the bulb sits at its power-on level indefinitely.
#
# ZHA marks a mains device unavailable once it has not been seen for
# `consider_unavailable_mains`, which is set to 60 in the ZHA config entry
# options (Settings -> Devices & Services -> ZHA -> Configure). Do not raise it
# or this automation stops firing.
#
# VERIFIED ON REAL USAGE, not just restarts. Between 08-17 and 08-20 this fired
# 8 times; 7 were genuine wall-switch returns with the nearest HA restart 8-21
# hours away, after outages of 24m, 35m, 2h20m, 7h04m, 7h15m, 7h16m and 10h05m.
#
# KNOWN LIMITATION -- flicks shorter than roughly 90s (the 60s threshold plus
# ZHA's check interval) are NOT covered. The entity never leaves 'on', so there
# is no edge to trigger on and the bulb keeps whatever level it powered up at
# until the next real cycle. Shortest confirmed working outage is 24 minutes;
# 90s-24m is untested but should work by the same mechanism. There is no known
# fix for the sub-90s case short of not cutting mains to the bulb at all.
#
# EXPECTED BEHAVIOUR: 5-10 seconds of wrong brightness after a flip -- ZHA needs
# a few seconds to notice the bulb, then the 3s delay below -- and then it snaps
# to the curve. If that is too long at night, the only real fix is to stop
# cutting mains (smart relay, or leave the switch on and use a Zigbee button).
#
# Keep select.*_power_on_behavior set to "On". If it is set to "Off", flipping
# the wall switch would leave the room dark, which is worse than a bright flash.
- id: bathroom_adaptive_lighting_reapply_on_available
  # Must be explicit. Dropping this key does NOT re-enable the automation --
  # without it HA restores the entity's last persisted enabled/disabled state,
  # which was 'off' from the power-on-level test, so it stayed off across a
  # restart even after the `initial_state: false` line was removed. That is why
  # this appeared never to fire after 08-20: it was disabled, not broken.
  initial_state: true
  alias: Bathroom light - re-apply adaptive curve when it comes back on
  description: >-
    Covers the wall-switch/rejoin case that Adaptive Lighting's own
    off -> on handler does not catch. Corrects the power-on flash after
    the fact; it cannot prevent it.
  mode: single
  triggers:
    # `to: "on"` only fires on real state changes, not on the attribute-only
    # updates AL's own adapts produce, so this cannot feed back on itself.
    - trigger: state
      entity_id: light.third_reality_inc_3rcb01057z
      from: unavailable
      to: "on"
  actions:
    # Let ZHA finish interrogating the device; commands sent before that tend to
    # be dropped. Deliberately NOT shortened below 3s: this value is what the 7
    # confirmed real-usage firings ran with, and ThirdReality's own bug thread
    # (discuss.3reality.com/d/67) documents this bulb silently dropping commands
    # that carry a brightness payload. Shaving 2s off a 5-10s flash is not worth
    # reintroducing that. If drops are ever observed, the vendor's workaround is
    # turn_on first, ~100ms delay, then set brightness -- not a shorter delay.
    - delay: "00:00:03"
    - action: adaptive_lighting.apply
      data:
        entity_id: switch.bathroom_adaptive_lighting_adaptive_lighting_bathroom_adaptive_lighting
        lights: light.third_reality_inc_3rcb01057z
        transition: 2
        turn_on_lights: false
