# Service status probes for the homelab dashboard.
#
# Replaces the old `homepage` stack's service cards. Included from
# configuration.yaml as `command_line: !include command_line.yaml`.
#
# Each probe runs `curl` inside the HA container -- verified present at
# /usr/bin/curl on ghcr.io/home-assistant/home-assistant:stable. The container
# is network_mode: host, so it probes from the Pi's own network position: LAN
# IPs and public hostnames both resolve, but Docker service names do NOT
# (there is no container IP to resolve them against).
#
# `-f` makes curl exit non-zero on HTTP >= 400, so `&& echo ON || echo OFF`
# covers both a bad status code and a refused/timed-out connection. That is
# why there is no value_template here: ON/OFF are command_line's default
# payload_on/payload_off.
#
# `-L` follows redirects, which matters for the services that 302 on `/`
# (Pi-hole -> /admin/login, Vaultwarden -> /#/).
#
# Entities are named "Status <service>" so they land on predictable ids
# (binary_sensor.status_blog) and cannot collide with the entities the
# Glances and Pi-hole integrations create for the same machines.
# --- Public services, probed end-to-end through the real user path:
# --- public DNS -> traefik -> TLS -> the service itself. A failure here
# --- means a visitor would see the failure too, which is the point.
- binary_sensor:
    name: Status Blog
    unique_id: status_blog
    command: 'curl -sfL -o /dev/null --max-time 10 https://blog.bcrowthe.com/ && echo ON || echo OFF'
    device_class: connectivity
    scan_interval: 60

- binary_sensor:
    name: Status FPS
    unique_id: status_fps
    command: 'curl -sfL -o /dev/null --max-time 10 https://fps.bcrowthe.com/ && echo ON || echo OFF'
    device_class: connectivity
    scan_interval: 60

- binary_sensor:
    name: Status Vaultwarden
    unique_id: status_vaultwarden
    command: 'curl -sfL -o /dev/null --max-time 10 https://vault.bcrowthe.com/ && echo ON || echo OFF'
    device_class: connectivity
    scan_interval: 60

- binary_sensor:
    name: Status Maddy
    unique_id: status_maddy
    command: 'curl -sfL -o /dev/null --max-time 10 https://maddy.bcrowthe.com/ && echo ON || echo OFF'
    device_class: connectivity
    scan_interval: 60

- binary_sensor:
    name: Status Whoami
    unique_id: status_whoami
    command: 'curl -sfL -o /dev/null --max-time 10 https://whoami.bcrowthe.com/ && echo ON || echo OFF'
    device_class: connectivity
    scan_interval: 60

# --- Infrastructure, probed internally.

# Traefik is checked on the host's own :443 rather than its API port. The
# API (--api.insecure=true) is deliberately NOT published to the host -- it
# is reachable only on the traefik_backend bridge, at an IP Docker assigns
# and may change. Loopback :443 has no such fragility.
#
# Traefik answers 404 here because no router matches Host(`127.0.0.1`); that
# is still proof it is alive and serving TLS. So the test is "did we get any
# HTTP response at all" -- curl writes 000 when the connection itself fails.
- binary_sensor:
    name: Status Traefik
    unique_id: status_traefik
    command: 'curl -sk -o /dev/null -w "%{http_code}" --max-time 10 https://127.0.0.1/'
    value_template: "{{ 'ON' if value | int(0) > 0 else 'OFF' }}"
    device_class: connectivity
    scan_interval: 60

- binary_sensor:
    name: Status Pi-hole
    unique_id: status_pihole
    command: 'curl -sfL -o /dev/null --max-time 10 http://192.168.2.3:8314/admin/ && echo ON || echo OFF'
    device_class: connectivity
    scan_interval: 60

# The two Glances backends. These are what the Glances integrations below
# feed on, so if one of these goes OFF the CPU/memory/temperature cards for
# that machine will go unavailable rather than stale.
- binary_sensor:
    name: Status Glances Pi5
    unique_id: status_glances_pi5
    command: 'curl -sfL -o /dev/null --max-time 10 http://192.168.2.2:61208/api/4/cpu && echo ON || echo OFF'
    device_class: connectivity
    scan_interval: 60

- binary_sensor:
    name: Status Glances Pi3
    unique_id: status_glances_pi3
    command: 'curl -sfL -o /dev/null --max-time 10 http://192.168.2.3:61208/api/4/cpu && echo ON || echo OFF'
    device_class: connectivity
    scan_interval: 60

# --- Vaultwarden backup health -------------------------------------------
#
# Source is a status file written by ../../vaultwarden/backup.sh on EVERY exit
# path, success or failure. It lands in this directory, which is bind mounted
# into this container as /config, so the sensor is a plain file read: no API
# token, no network hop, nothing to leak, and it keeps working if the network
# is down (which is exactly when you want to trust your backup monitoring).
#
# The critical design point is that "no news" must not read as good news. Three
# distinct failures have to look identical to Home Assistant:
#
#   1. the backup ran and failed        -> status field is "failed"
#   2. the backup never ran at all      -> file is stale (timer dead, Pi down,
#                                          unit masked, disk full at boot)
#   3. the backup was never set up      -> file absent
#
# A sensor that only checks the status field catches (1) and silently reports
# healthy forever for (2) and (3) -- the failure mode that matters most, since
# a backup system that quietly stops running is the normal way this goes wrong.
# The mtime check covers (2): backup.sh rewrites this file on every run, so its
# mtime IS the last-attempt time even when the script dies early.
#
# 129600s = 36h. The timer is daily with up to 15 min jitter, so 36h tolerates
# one late or missed run without crying wolf, while still alerting well within
# the 30-backup retention window.
#
# All four states were tested against this exact command inside the HA
# container: healthy -> OFF, status failed -> ON, 3-day-old file -> ON,
# missing file -> ON, 20h-old healthy file -> OFF.
- binary_sensor:
    name: Vaultwarden Backup Problem
    unique_id: vaultwarden_backup_problem
    command: >-
      f=/config/vaultwarden_backup.json;
      if [ ! -f "$f" ]; then echo ON;
      elif [ $(( $(date +%s) - $(stat -c %Y "$f") )) -gt 129600 ]; then echo ON;
      elif ! grep -q '"status": *"ok"' "$f"; then echo ON;
      else echo OFF; fi
    device_class: problem
    scan_interval: 300

# Detail companion. State is the status word; `ciphers` and `retained` ride as
# attributes. `ciphers` is the useful one -- if it ever drops toward zero while
# the vault is in use, the problem is the vault, not the backup.
- sensor:
    name: Vaultwarden Backup
    unique_id: vaultwarden_backup
    command: 'cat /config/vaultwarden_backup.json 2>/dev/null || echo {}'
    value_template: "{{ value_json.status | default('unknown') }}"
    json_attributes:
      - timestamp
      - ciphers
      - retained
    scan_interval: 300
